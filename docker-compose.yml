version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mintora-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mintora

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: mintora-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mongodb_data:
  rabbitmq_data:
