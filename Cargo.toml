[workspace]
members = [
    "crates/api",
    "crates/grpc",
    "crates/adapters",
    "crates/domain",
    "crates/database",
    "crates/queue",
    "crates/shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mintora Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
# Web framework
axum = "0.7"
# gRPC
tonic = "0.12"
tonic-build = "0.12"
# Database
mongodb = "3.1"
# Queue
lapin = "2.5"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Auth
bcrypt = "0.15"
jsonwebtoken = "9.3"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Utils
uuid = { version = "1.10", features = ["v4", "serde"] }
